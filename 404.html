<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found (404) | DigiFront Door</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <!-- Simple Header -->
  <header style="padding: 24px; text-align: center;">
    <a class="logo" href="index.html" style="justify-content: center; color: #fff;">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="4" y="1.5" width="12" height="17" rx="2" stroke="#e8742f" stroke-width="2"/>
        <circle cx="12.5" cy="10.5" r="1.3" fill="#e8742f"/>
      </svg>
      DigiFront Door
    </a>
  </header>

  <!-- 404 Central Box -->
  <main style="padding: 40px 24px; text-align: center; margin: auto;">
    <div style="width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 50%; background: rgba(232, 116, 47, 0.15); display: flex; align-items: center; justify-content: center; color: var(--accent);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="9" x2="15" y2="15"></line>
        <line x1="15" y1="9" x2="9" y2="15"></line>
      </svg>
    </div>

    <span class="badge badge-accent" style="margin-bottom: 16px;">Error 404</span>
    <h1 style="font-size: clamp(34px, 5.5vw, 64px); font-weight: 700; color: #fff; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 16px;">
      This door seems to be closed.
    </h1>
    <p style="font-size: clamp(16px, 1.6vw, 19px); color: #b7b5cb; max-width: 44ch; margin: 0 auto 36px; line-height: 1.5;">
      The page you are looking for has been moved or does not exist. Let's get you back to the right place.
    </p>

    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
      <a href="index.html" class="btn-accent">Return to Home &rarr;</a>
      <a href="services.html" class="btn-ghost">View Services</a>
      <a href="contact.html" class="btn-ghost">Contact Us</a>
    </div>

    <div style="margin-top: 48px; display: flex; justify-content: center; gap: 20px; font-size: 14px; color: #8e8ca7;">
      <a href="projects.html" style="color: #a4a2be;">Projects</a>
      <span>&bull;</span>
      <a href="pricing.html" style="color: #a4a2be;">Pricing</a>
      <span>&bull;</span>
      <a href="about.html" style="color: #a4a2be;">About</a>
      <span>&bull;</span>
      <a href="faq.html" style="color: #a4a2be;">FAQ</a>
    </div>
  </main>

  <!-- Footer Minimal -->
  <footer style="padding: 24px; text-align: center; font-size: 13px; color: #767490; border-top: 1px solid var(--night-border);">
    &copy; <span class="current-year">2026</span> DigiFront Door. All rights reserved.
  </footer>

  <script src="js/main.js"></script>

</html>
